<!doctype html>
<!-- The installed app's offline page (app shell stage 4): shown by the service worker (src/lib/offlineWorker.ts) only
     when a page cannot be fetched at all. No data in it, no script: "Try again" is a link to the page that was asked
     for (an empty href is this address), so it works with any content policy. Nothing it uses comes from the network:
     only this file is kept for offline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You are offline | FieGH</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: #FAF7F2; color: #1F1B16;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.5;
  }
  main { max-width: 420px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; line-height: 1.2; }
  p { margin: 0; color: #6B645C; }
  a {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 24px; padding: 0 24px;
    border-radius: 12px; background: #C9932E; color: #1F1B16; font-weight: 600; text-decoration: none;
  }
  a:focus-visible { outline: 2px solid #8A5E10; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>FieGH needs a connection to show homes, prices and bookings. Check your connection, then try again.</p>
  <a href="">Try again</a>
</main>
</body>
</html>
